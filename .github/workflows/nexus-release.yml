name: NEXUS Browser — Compilation & Publication APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publier une GitHub Release avec l'APK généré"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      release_notes:
        description: "Notes de version personnalisées (optionnel)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release NEXUS APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source NEXUS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Installation et configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: 3. Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: 4. Restauration sécurisée de la clé de signature Android
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/nexus-release.keystore
            echo "Clé de signature officielle restaurée depuis GitHub Secrets."
          else
            echo "::error::Le secret NEXUS_KEYSTORE_BASE64 est manquant. Impossible de garantir la compatibilité de signature des mises à jour."
            exit 1
          fi

      - name: 5. Extraction des informations de version du projet
        id: version_info
        run: |
          chmod +x gradlew
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Version détectée : v$VERSION_NAME (versionCode=$VERSION_CODE)"

      - name: 6. Exécution des tests unitaires
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 7. Compilation de l'APK Release signé
        env:
          NEXUS_KEYSTORE_PATH: keystore/nexus-release.keystore
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
          NEXUS_GITHUB_OWNER: ${{ github.repository_owner }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 8. Vérification de l'APK généré et de sa signature Android
        id: verify_apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "::error::Aucun fichier APK trouvé après assembleRelease."
            exit 1
          fi

          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          VERSIONED_APK="NEXUS-v${VERSION_NAME}.apk"
          cp "$RAW_APK" "$VERSIONED_APK"
          cp "$RAW_APK" "NEXUS.apk"

          APK_SIZE=$(stat -c%s "$VERSIONED_APK")
          APK_SHA256=$(sha256sum "$VERSIONED_APK" | awk '{print $1}')

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$VERSIONED_APK"

          echo "versioned_apk=$VERSIONED_APK" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT
          echo "APK vérifié : $VERSIONED_APK ($APK_SIZE octets, SHA-256: $APK_SHA256)"

      - name: 9. Archivage de l'APK en artefact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-v${{ steps.version_info.outputs.version_name }}-APK
          path: |
            NEXUS-v${{ steps.version_info.outputs.version_name }}.apk
            NEXUS.apk
          if-no-files-found: error

      - name: 10. Préparation du Changelog de la Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true')
        id: changelog
        run: |
          CustomNotes="${{ inputs.release_notes }}"
          if [ -n "$CustomNotes" ]; then
            echo "$CustomNotes" > RELEASE_NOTES.md
          else
            PREV_TAG=$(git tag --sort=-creatordate | grep -v "^v${{ steps.version_info.outputs.version_name }}$" | head -n 1 || true)
            echo "## Nouveautés de NEXUS Browser v${{ steps.version_info.outputs.version_name }}" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges >> RELEASE_NOTES.md
            else
              git log -n 10 --pretty=format:"- %s" --no-merges >> RELEASE_NOTES.md
            fi
            echo "" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "---" >> RELEASE_NOTES.md
            echo "- **Version** : ${{ steps.version_info.outputs.version_name }} (Build ${{ steps.version_info.outputs.version_code }})" >> RELEASE_NOTES.md
            echo "- **Fichier APK** : \`${{ steps.verify_apk.outputs.versioned_apk }}\`" >> RELEASE_NOTES.md
            echo "- **SHA-256 APK** : \`${{ steps.verify_apk.outputs.apk_sha256 }}\`" >> RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: 11. Publication de la GitHub Release avec l'APK officiel
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "NEXUS Browser v${{ steps.version_info.outputs.version_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.verify_apk.outputs.versioned_apk }}
            NEXUS.apk
